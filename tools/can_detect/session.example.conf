# Example session configuration for can_detect. Copy it, edit the copy, keep the
# copy with the session results.
#
#   python3 -m can_detect.config tools/can_detect/session.example.conf
#
# The values below are the ones this plan starts from, taken from the answers to
# the open questions of the rpi-detekcja-anomalii spec. They are recommendations
# written into a file, not defaults built into the program: can_detect/config.py
# never fills in a parameter that is absent here, it stops the session and names
# the parameter (criterion 11.2). A configuration without window_s is therefore
# an error, not a session running with 1 s.
#
# Relative paths resolve against the directory of this file. A hash starts a
# comment only at the beginning of a line, so it may appear inside a path.
# dbc_path may be repeated, in which case the order is kept; every other
# parameter appears exactly once.
#
# Window length and standard deviation multiplier are the two values task 13.4
# revisits experimentally. Whatever is finally used gets its justification in the
# work log, and the copy of this file stored with the results is what ties a
# table in the thesis to the numbers it was produced from.

# Network definition of the test bench. 125 messages, 367 signals, no
# GenMsgCycleTime attributes, which is why transmission periods come from the
# baseline profile rather than from here.
dbc_path = ../../generator/dbc/RTE_3.5_CAN1_CAR.dbc

# Baseline profile computed from a 60 s reference run by can_detect/baseline.py.
# The file does not have to exist to validate this configuration; it has to exist
# when a session starts, because its checksum goes into the session report.
baseline_path = baseline/reference.profile

# Analysis window. At CAN periods of 10 to 100 ms a window of 1 s holds 10 to 100
# frames per identifier, enough for a count to mean something.
window_s = 1.0

# Three sigma rule. A feature outside mean plus minus this many standard
# deviations of the baseline is reported as a statistical deviation.
sigma_multiplier = 3.0

# Missing frame threshold, in multiples of the period from the baseline profile.
# An identifier silent for longer than period times this value is reported.
missing_frame_multiplier = 3.0

# Minimum number of interframe interval observations per CAN ID before the
# baseline assigns that identifier a period and a tolerance. Identifiers below
# the threshold enter the profile without a period (criterion 3.3).
min_interval_observations = 100

# Shortest run of frames with an interval well below the expected period that
# still counts as a burst.
burst_min_frames = 5

# An interval is short when it is strictly below expected period multiplied by
# this factor. The factor is explicit so the threshold used by a session is
# recoverable from its saved configuration.
burst_interval_factor = 0.5

# Tolerance window used when matching an anomaly event to a ground truth
# episode. Widening it hides detection latency, so it stays close to the
# analysis window.
match_tolerance_s = 1.0

# Seed of the random number generator, recorded in the session report so that a
# run of Isolation Forest or One-Class SVM can be repeated exactly.
random_seed = 20260919
